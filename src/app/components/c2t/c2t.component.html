<div class="card">
  <div class="h1" style="font-size:18px;margin-bottom:8px">Pick all technologies that fit the <b>Use Case</b></div>
  <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 12px;">
    <div class="card" *ngFor="let c of cases">
      <div class="h1" style="font-size:14px">{{c.text}} <span class="pill">{{c.difficulty || 'all'}}</span></div>
      <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 8px;">
        <button class="tech-card" (click)="toggle(c.id, t.id)" [class.selected]="isSel(c.id, t.id)" *ngFor="let t of techs">
          <div><b>{{t.name}}</b> <span class="pill">{{t.type}}</span></div>
          <div class="hint">{{t.rationale}}</div>
        </button>
      </div>
      <div class="hint">F1: {{results()?.detail[c.id]?.toFixed(2) || '—'}}</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button class="btn primary" (click)="submit()">Submit</button>
    <button class="btn" (click)="reset()">Reset</button>
    <div *ngIf="results()" class="badge">Average F1: <b>{{results()?.avgF1.toFixed(2)}}</b></div>
  </div>
</div>
