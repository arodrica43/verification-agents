<div class="card" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between">
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <button class="btn" [class.primary]="mode==='t2c'" (click)="modeChange.emit('t2c')">Tech → Use Case</button>
    <button class="btn" [class.primary]="mode==='c2t'" (click)="modeChange.emit('c2t')">Use Case → Tech</button>
    <select class="btn" [value]="difficulty" (change)="difficultyChange.emit(($event.target as HTMLSelectElement).value as any)">
      <option value="all">All difficulties</option>
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <button class="btn" (click)="shuffle.emit()">Shuffle</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span class="badge">⏱ {{seconds}}s</span>
    <button class="btn" *ngIf="!timerOn" (click)="startTimer.emit()">Start</button>
    <button class="btn" *ngIf="timerOn" (click)="stopTimer.emit()">Stop</button>
    <button class="btn" (click)="exportJson.emit()">Export</button>
    <label class="btn"><input type="file" hidden accept="application/json" (change)="onImport($event)">Import</label>
    <button class="btn" (click)="openEditor.emit()">Edit Data</button>
    <button class="btn" (click)="resetSample.emit()">Reset Sample</button>
  </div>
</div>
