<div class="container">
  <div class="header">
    <div class="h1">{{title}}</div>
    <app-toolbar
      [mode]="mode()" [difficulty]="difficulty()" [timerOn]="timerOn()" [seconds]="seconds()"
      (modeChange)="setMode($event)" (difficultyChange)="setDifficulty($event)"
      (shuffle)="shuffle()" (startTimer)="startTimer()" (stopTimer)="stopTimer()"
      (exportJson)="exportData()" (resetSample)="resetSample()" (openEditor)="toggleEditor()"
      (importJson)="importData($event)"></app-toolbar>
  </div>

  <div class="grid" style="grid-template-columns: 1fr 320px; gap: 16px;">
    <div>
      <app-t2c *ngIf="mode()==='t2c'" [techs]="filteredTechs()" [cases]="filteredCases()" [seed]="seed()"></app-t2c>
      <app-c2t *ngIf="mode()==='c2t'" [techs]="filteredTechs()" [cases]="filteredCases()" [seed]="seed()"></app-c2t>
    </div>
    <app-answer-key [techs]="filteredTechs()" [cases]="filteredCases()"></app-answer-key>
  </div>

  <app-editor *ngIf="showEditor()" [data]="data()" (close)="toggleEditor()" (save)="replaceData($event)"></app-editor>

  <div class="footer">Tip: Use difficulty filters for quick rounds. The Answer Key helps facilitate your explanation.</div>
</div>
