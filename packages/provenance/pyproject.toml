[project]
name = "formal-provenance"
version = "0.1.0"
description = "Canonicalization, hashing, and provenance DAG utilities"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "formal-shared",
  "formal-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_provenance"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
