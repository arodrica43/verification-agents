[project]
name = "formal-store"
version = "0.1.0"
description = "PostgreSQL artifact, provenance, and audit persistence (Phase 2)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "psycopg[binary]>=3.2",
  "formal-shared",
  "formal-schemas",
  "formal-domain",
  "formal-provenance",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_store"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
