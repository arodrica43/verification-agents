[project]
name = "formal-agent-core"
version = "0.1.0"
description = "LangGraph agent core (Phase 5 scaffold)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "formal-schemas",
  "formal-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_agent_core"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
