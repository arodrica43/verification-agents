[project]
name = "formal-shared"
version = "0.1.0"
description = "Shared utilities for the Formal Platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_shared"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
