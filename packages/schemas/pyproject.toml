[project]
name = "formal-schemas"
version = "0.1.0"
description = "Versioned Pydantic schemas for the Formal Platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "formal-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_schemas"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
