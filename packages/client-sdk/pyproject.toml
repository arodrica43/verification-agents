[project]
name = "formal-client-sdk"
version = "0.1.0"
description = "Python client SDK (scaffold)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "formal-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_client_sdk"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
