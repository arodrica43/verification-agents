[project]
name = "formal-domain"
version = "0.1.0"
description = "Domain entities and services for the Formal Platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "formal-shared",
  "formal-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_domain"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
