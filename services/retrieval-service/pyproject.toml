[project]
name = "formal-retrieval"
version = "0.1.0"
description = "Tenant-scoped hybrid retrieval service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "formal-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_retrieval"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
