[project]
name = "formal-certificate-service"
version = "0.1.0"
description = "Certificate issuance service (Phase 1 scaffold)"
requires-python = ">=3.12"
dependencies = [
  "formal-certificate-sdk",
  "formal-schemas",
  "formal-provenance",
  "formal-proof-service",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formal_certificate_service"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
